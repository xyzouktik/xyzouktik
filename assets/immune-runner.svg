<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 900 180" width="900" height="180" role="img" aria-labelledby="irTitle">
  <title id="irTitle">A bacterium runs across a microscope slide, jumping white blood cells, cytotoxic T cells and antibodies</title>
  <style>
    .run{animation:run 4.5s linear infinite}
    .fly{animation:fly 5.5s ease-in-out infinite}
    .jump{transform-box:fill-box;transform-origin:center;animation:jump 4.5s linear infinite}
    .ticks{animation:ticks 1.5s linear infinite}
    @keyframes run{from{transform:translateX(940px)}to{transform:translateX(-120px)}}
    @keyframes jump{0%,14%{transform:translateY(0) rotate(0)}30%{transform:translateY(-58px) rotate(-9deg)}46%{transform:translateY(0) rotate(0)}100%{transform:translateY(0) rotate(0)}}
    @keyframes ticks{from{transform:translateX(0)}to{transform:translateX(-60px)}}
    @keyframes fly{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
    @media (prefers-reduced-motion: reduce){.run,.fly,.jump,.ticks{animation:none !important}}
  </style>
  <defs>
    <radialGradient id="vign" cx="50%" cy="40%" r="75%">
      <stop offset="0" stop-color="#94a3b8" stop-opacity=".10"/>
      <stop offset="1" stop-color="#94a3b8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="900" height="180" fill="url(#vign)"/>
  <circle cx="140" cy="46" r="3" fill="#94a3b8" opacity=".18"/>
  <circle cx="330" cy="92" r="2.5" fill="#94a3b8" opacity=".14"/>
  <circle cx="540" cy="38" r="3.5" fill="#94a3b8" opacity=".16"/>
  <circle cx="700" cy="104" r="2.5" fill="#94a3b8" opacity=".14"/>
  <circle cx="820" cy="60" r="3" fill="#94a3b8" opacity=".16"/>
  <g class="ticks" stroke="#94a3b8" stroke-width="2" opacity=".35" stroke-linecap="round">
    <line x1="0" y1="152" x2="0" y2="158"/><line x1="60" y1="152" x2="60" y2="158"/>
    <line x1="120" y1="152" x2="120" y2="158"/><line x1="180" y1="152" x2="180" y2="158"/>
    <line x1="240" y1="152" x2="240" y2="158"/><line x1="300" y1="152" x2="300" y2="158"/>
    <line x1="360" y1="152" x2="360" y2="158"/><line x1="420" y1="152" x2="420" y2="158"/>
    <line x1="480" y1="152" x2="480" y2="158"/><line x1="540" y1="152" x2="540" y2="158"/>
    <line x1="600" y1="152" x2="600" y2="158"/><line x1="660" y1="152" x2="660" y2="158"/>
    <line x1="720" y1="152" x2="720" y2="158"/><line x1="780" y1="152" x2="780" y2="158"/>
    <line x1="840" y1="152" x2="840" y2="158"/><line x1="900" y1="152" x2="900" y2="158"/>
    <line x1="960" y1="152" x2="960" y2="158"/>
  </g>
  <line x1="0" y1="150" x2="900" y2="150" stroke="#94a3b8" stroke-width="2" opacity=".5" stroke-linecap="round"/>

  <g class="run" style="animation-delay:-2.7s">
    <circle cx="0" cy="136" r="13" fill="#cbd5e1" stroke="#64748b" stroke-width="1.5"/>
    <circle cx="-4" cy="133" r="4.5" fill="#64748b" opacity=".75"/>
    <circle cx="4" cy="140" r="3.5" fill="#64748b" opacity=".6"/>
  </g>
  <g class="run" style="animation-delay:-2.3s">
    <circle cx="0" cy="139" r="11" fill="#2dd4bf" stroke="#0f766e" stroke-width="1.5"/>
    <circle cx="-3" cy="136" r="2" fill="#0f766e"/><circle cx="3" cy="139" r="2" fill="#0f766e"/><circle cx="-1" cy="142" r="2" fill="#0f766e"/>
  </g>
  <g class="run" style="animation-delay:-1.9s">
    <circle cx="0" cy="140" r="10" fill="#e2e8f0" stroke="#64748b" stroke-width="1.4"/>
    <circle cx="2" cy="137" r="3.4" fill="#64748b" opacity=".7"/>
  </g>

  <g class="run" style="animation-delay:-2.5s"><g class="fly">
    <circle cx="0" cy="96" r="10" fill="#2dd4bf" stroke="#0f766e" stroke-width="1.5"/>
    <circle cx="-3" cy="93" r="2" fill="#0f766e"/><circle cx="3" cy="96" r="2" fill="#0f766e"/><circle cx="0" cy="99" r="2" fill="#0f766e"/>
  </g></g>
  <g class="run" style="animation-delay:-2.0s"><g class="fly">
    <path d="M0,-9 L0,3 M0,-9 L-8,-16 M0,-9 L8,-16" fill="none" stroke="#a78bfa" stroke-width="3" stroke-linecap="round"/>
  </g></g>
  <g class="run" style="animation-delay:-1.6s"><g class="fly">
    <circle cx="0" cy="112" r="12" fill="#f59e0b" opacity=".9" stroke="#b45309" stroke-width="1.5"/>
    <circle cx="-3" cy="109" r="4" fill="#b45309" opacity=".7"/>
  </g></g>

  <g transform="translate(112,150)">
    <g class="jump">
      <path d="M-18,-2 q-8,-6 -16,0 q8,6 16,0" fill="none" stroke="#34d399" stroke-width="2" opacity=".8" stroke-linecap="round"/>
      <path d="M-18,-9 q-8,6 -16,0 q8,-6 16,0" fill="none" stroke="#34d399" stroke-width="2" opacity=".55" stroke-linecap="round"/>
      <rect x="-17" y="-14" width="34" height="13" rx="6.5" fill="#34d399" stroke="#0f766e" stroke-width="1.4"/>
      <circle cx="-8" cy="-8" r="2.2" fill="#0f766e"/>
      <circle cx="-2" cy="-8" r="2.2" fill="#0f766e"/>
    </g>
  </g>
</svg>
